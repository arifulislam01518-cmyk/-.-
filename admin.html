/* =========================================================
   Excel / PDF Import System
   ========================================================= */
function normalizeHeader(h) {
  let s = String(h || '').trim().toLowerCase()
    .replace(/\uFEFF/g, '')
    .replace(/[\s_\-\.\/]+/g, '');
  // Keep original cleaned for matching; aliases handled in mapRow
  return s;
}

function headerMatches(normalizedKey, aliases) {
  const nk = normalizedKey;
  for (const a of aliases) {
    const aa = String(a).toLowerCase().replace(/[\s_\-\.\/]+/g, '');
    if (!aa) continue;
    if (nk === aa || nk.includes(aa) || aa.includes(nk)) return true;
  }
  return false;
}

function readExcelFile(file) {
  return new Promise((resolve, reject) => {
    const name = (file.name || '').toLowerCase();
    const mime = (file.type || '').toLowerCase();
    const isCsv = name.endsWith('.csv') || name.endsWith('.txt') || mime.includes('csv') || mime.includes('text/plain');

    function parseWithXLSX(data, type, opts) {
      if (!window.XLSX) throw new Error('Excel লাইব্রেরি লোড হয়নি। ইন্টারনেট চালু করে পেজ রিফ্রেশ করুন।');
      const wb = XLSX.read(data, Object.assign({ type: type, cellDates: true, codepage: 65001 }, opts || {}));
      if (!wb.SheetNames || !wb.SheetNames.length) throw new Error('শিট পাওয়া যায়নি');
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
      return rows;
    }

    function parseCsvText(text) {
      if (!text || !String(text).trim()) throw new Error('ফাইল খালি');
      text = String(text);
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
      const firstLine = (text.split(/\r?\n/).find(l => l.trim()) || '');
      const commas = (firstLine.match(/,/g) || []).length;
      const semis = (firstLine.match(/;/g) || []).length;
      const tabs = (firstLine.match(/\t/g) || []).length;
      let sep = ',';
      if (semis > commas && semis >= tabs) sep = ';';
      else if (tabs > commas && tabs >= semis) sep = '\t';
      // Prefer SheetJS
      if (window.XLSX) {
        try {
          return parseWithXLSX(text, 'string', { FS: sep });
        } catch (e1) {
          try { return parseWithXLSX(text, 'string'); } catch (e2) {}
        }
      }
      // Manual CSV (handles quoted fields simply)
      const lines = text.split(/\r?\n/).filter(l => l.trim());
      if (!lines.length) return [];
      function splitLine(line) {
        const out = [];
        let cur = '', inQ = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            if (inQ && line[i+1] === '"') { cur += '"'; i++; }
            else inQ = !inQ;
          } else if (ch === sep && !inQ) {
            out.push(cur); cur = '';
          } else cur += ch;
        }
        out.push(cur);
        return out.map(x => x.trim());
      }
      const headers = splitLine(lines[0]);
      return lines.slice(1).map(line => {
        const cols = splitLine(line);
        const obj = {};
        headers.forEach((h, i) => { obj[h] = cols[i] || ''; });
        return obj;
      });
    }

    if (isCsv) {
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const rows = parseCsvText(e.target.result);
          if (!rows.length) reject(new Error('CSV-তে কোনো ডেটা নেই'));
          else resolve(rows);
        } catch (err) { reject(err); }
      };
      reader.onerror = () => reject(new Error('CSV পড়া যায়নি'));
      reader.readAsText(file, 'UTF-8');
      return;
    }

    // Excel binary
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = new Uint8Array(e.target.result);
        const rows = parseWithXLSX(data, 'array');
        if (!rows.length) {
          // maybe misdetected csv
          const reader2 = new FileReader();
          reader2.onload = e2 => {
            try {
              const rows2 = parseCsvText(e2.target.result);
              if (!rows2.length) reject(new Error('ফাইলে কোনো ডেটা নেই'));
              else resolve(rows2);
            } catch (err2) { reject(err2); }
          };
          reader2.onerror = () => reject(new Error('ফাইল পড়া যায়নি'));
          reader2.readAsText(file, 'UTF-8');
          return;
        }
        resolve(rows);
      } catch (err) {
        const reader2 = new FileReader();
        reader2.onload = e2 => {
          try { resolve(parseCsvText(e2.target.result)); }
          catch (err2) { reject(err); }
        };
        reader2.onerror = () => reject(err);
        reader2.readAsText(file, 'UTF-8');
      }
    };
    reader.onerror = () => reject(new Error('ফাইল পড়া যায়নি'));
    reader.readAsArrayBuffer(file);
  });
}

function mapRow(row, fieldMap) {
  const out = {};
  const keys = Object.keys(row || {});
  for (const [target, aliases] of Object.entries(fieldMap)) {
    for (const k of keys) {
      const nk = normalizeHeader(k);
      if (headerMatches(nk, aliases)) {
        out[target] = String(row[k] ?? '').trim();
        break;
      }
    }
  }
  return out;
}

async function importStudentsFromExcel(file) {
  const rows = await readExcelFile(file);
  if (!rows.length) { toast('Excel-এ কোনো ডেটা নেই', 'err'); return; }
  const fieldMap = {
    name: ['name', 'নাম', 'studentname', "student'sname", 'student'],
    father: ['father', 'পিতা', 'fathername', "father'sname"],
    class: ['class', 'শ্রেণি', 'শ্রেণী', 'grade'],
    roll: ['roll', 'রোল', 'rollnumber', 'rollno'],
    studentId: ['id', 'studentid', 'আইডি', 'aid', 'sid'],
    year: ['year', 'বছর', 'শিক্ষাবর্ষ', 'session', 'academicyear']
  };
  let added = 0;
  rows.forEach(row => {
    const m = mapRow(row, fieldMap);
    if (!m.name || (!m.roll && !m.studentId)) return;
    const sid = m.studentId || m.roll;
    const exists = (DB.students || []).some(s => (s.studentId === sid || s.roll === sid) && s.class === (m.class || ''));
    if (exists) return;
    DB.students.push({
      id: uid('s'),
      name: m.name,
      father: m.father || '',
      class: m.class || (DB.classes[0] || ''),
      studentId: sid,
      roll: m.roll || sid,
      year: m.year || (DB.academicYears[0] || '')
    });
    added++;
  });
  saveDB();
  renderAdmin();
  toast(added + ' জন শিক্ষার্থী ইমপোর্ট হয়েছে ✓', 'gold');
}

async function importResultsFromExcel(file) {
  const rows = await readExcelFile(file);
  if (!rows.length) { toast('Excel-এ কোনো ডেটা নেই', 'err'); return; }
  // Expected flexible columns:
  // name, father, class, roll, year, exam, remarks
  // then pairs: subject / obtained / full  OR  subject1, marks1, full1 ...
  let added = 0;
  const groups = {}; // key = class|roll|year|exam

  rows.forEach(row => {
    const keys = Object.keys(row);
    const get = (...aliases) => {
      for (const k of keys) {
        const nk = normalizeHeader(k);
        if (aliases.some(a => nk === a || nk.includes(a))) return String(row[k] ?? '').trim();
      }
      return '';
    };
    const name = get('name', 'studentname', 'নাম', "student'sname");
    const roll = get('roll', 'রোল', 'rollnumber', 'roll number');
    const sid  = get('id', 'studentid', 'student id', 'আইডি', 'aid');
    const cls  = get('class', 'শ্রেণি', 'শ্রেণী');
    if (!name || (!roll && !sid)) return;

    const year = get('year', 'বছর', 'শিক্ষাবর্ষ', 'session') || (DB.academicYears[0] || '');
    let exam = get('exam', 'examtype', 'পরীক্ষা', 'examination') || (DB.examTypes[0] || '');
    // normalize common english exam names
    const el = exam.toLowerCase();
    if (el.includes('half') || el.includes('অর্ধ')) exam = 'অর্ধবার্ষিক';
    else if (el.includes('final') || el.includes('annual') || el.includes('বার্ষিক')) exam = 'বার্ষিক';
    else if (el.includes('pre') && el.includes('select') || el.includes('প্রাক')) exam = 'প্রাক নির্বাচনি';
    else if (el.includes('select') || el.includes('নির্বাচনি')) exam = 'নির্বাচনি';

    const father = get('father', 'পিতা', 'fathername', "father'sname");
    const remarks = get('remarks', 'মন্তব্য', 'remark');
    const merit = get('merit', 'meritposition', 'position', 'মেধা', 'rank');
    let branch = get('branch', 'শাখা', 'section', 'group', 'type');
    const bl = (branch || '').toLowerCase();
    if (bl.includes('girl') || bl.includes('balika') || bl.includes('বালিকা') || bl.includes('female')) branch = 'বালিকা';
    else if (bl.includes('hif') || bl.includes('হিফজ') || bl.includes('hifz')) branch = 'হিফজ';
    else if (bl.includes('boy') || bl.includes('balok') || bl.includes('বালক') || bl.includes('male')) branch = 'বালক';
    else if (!branch) branch = 'বালক';

    const idVal = sid || roll;
    const rollVal = roll || sid;
    const key = [cls, idVal, year, exam].join('|');
    if (!groups[key]) {
      groups[key] = {
        id: uid('r'),
        studentName: name,
        fatherName: father,
        class: cls || (DB.classes[0] || ''),
        studentId: idVal,
        roll: rollVal,
        year,
        examType: exam,
        branch: branch,
        meritPosition: merit,
        remarks,
        subjects: []
      };
    }

    // Single-subject style row: subject + obtained + full
    const subj = get('subject', 'বিষয়', 'subjectname', 'subject name');
    const obt  = get('obtained', 'marks', 'প্রাপ্ত', 'score', 'mark', 'marks obtained', 'marksobtained');
    const full = get('full', 'total', 'পূর্ণ', 'fullmarks', 'full marks') || '100';
    if (subj) {
      groups[key].subjects.push({
        name: subj,
        obtained: Number(obt) || 0,
        full: Number(full) || 100
      });
    }

    // Multi-column style: Subject1, Obtained1, Full1 ... or Bangla variants
    for (let i = 1; i <= 20; i++) {
      const s = get('subject' + i, 'বিষয়' + i, 'sub' + i);
      if (!s) continue;
      const o = get('obtained' + i, 'marks' + i, 'প্রাপ্ত' + i, 'mark' + i) || '0';
      const f = get('full' + i, 'total' + i, 'পূর্ণ' + i) || '100';
      groups[key].subjects.push({
        name: s,
        obtained: Number(o) || 0,
        full: Number(f) || 100
      });
    }
  });

  Object.values(groups).forEach(r => {
    if (!r.subjects.length) {
      // fallback: if no subject columns, still save with empty subjects so user can edit
      r.subjects = [{ name: 'সাধারণ', obtained: 0, full: 100 }];
    }
    // avoid exact duplicate
    const exists = (DB.results || []).some(x =>
      (x.studentId === r.studentId || x.roll === r.roll) && x.class === r.class && x.year === r.year && x.examType === r.examType
    );
    if (!exists) {
      DB.results.push(r);
      added++;
    }
  });

  saveDB();
  renderAdmin();
  toast(added + ' টি ফলাফল ইমপোর্ট হয়েছে ✓', 'gold');
}

async function importNoticesFromExcel(file) {
  const rows = await readExcelFile(file);
  if (!rows.length) { toast('Excel-এ কোনো ডেটা নেই', 'err'); return; }
  const fieldMap = {
    title: ['title', 'শিরোনাম'],
    date: ['date', 'তারিখ'],
    summary: ['summary', 'সংক্ষিপ্ত'],
    body: ['body', 'বিস্তারিত', 'detail'],
    attachment: ['attachment', 'সংযুক্তি', 'file', 'url']
  };
  let added = 0;
  rows.forEach(row => {
    const m = mapRow(row, fieldMap);
    if (!m.title) return;
    let date = m.date || new Date().toISOString().slice(0, 10);
    // try parse common date formats
    if (date && !/^\d{4}-\d{2}-\d{2}/.test(date)) {
      const d = new Date(date);
      if (!isNaN(d)) date = d.toISOString().slice(0, 10);
    }
    DB.notices.push({
      id: uid('n'),
      title: m.title,
      date,
      summary: m.summary || '',
      body: m.body || '',
      attachment: m.attachment || '',
      published: true
    });
    added++;
  });
  saveDB();
  renderAdmin();
  toast(added + ' টি নোটিশ ইমপোর্ট হয়েছে ✓', 'gold');
}

function handleExcelImport(type, inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  const name = (file.name || '').toLowerCase();
  const mime = (file.type || '').toLowerCase();
  const okExt = name.endsWith('.xlsx') || name.endsWith('.xls') || name.endsWith('.csv') || name.endsWith('.txt');
  const okMime = mime.includes('csv') || mime.includes('sheet') || mime.includes('excel') || mime.includes('text') || mime === '';
  if (!okExt && !okMime) {
    toast('শুধু Excel (.xlsx / .xls) বা CSV সাপোর্ট করে', 'err');
    inputEl.value = '';
    return;
  }
  if (!window.XLSX) {
    toast('Excel লাইব্রেরি লোড হয়নি। ইন্টারনেট চালু করে পেজ রিফ্রেশ করুন।', 'err');
    inputEl.value = '';
    return;
  }
  toast('ইমপোর্ট হচ্ছে...', 'gold');
  const runners = {
    students: importStudentsFromExcel,
    teachers: importTeachersFromExcel,
    results: importResultsFromExcel,
    notices: importNoticesFromExcel
  };
  const fn = runners[type];
  if (!fn) return;
  fn(file).then(() => {
    // after import push to cloud if enabled
    try { if (typeof cloudPush === 'function') cloudPush(); } catch(e){}
  }).catch(err => {
    console.error(err);
    toast('ইমপোর্ট ব্যর্থ: ' + (err.message || 'অজানা সমস্যা'), 'err');
  }).finally(() => { try { inputEl.value = ''; } catch(e){} });
}


async function handleResultPdfImport(inputEl) {
  const file = inputEl.files[0];
  inputEl.value = '';
  if (!file) return;
  const name = (file.name || '').toLowerCase();
  if (!name.endsWith('.pdf')) {
    toast('শুধু PDF দিন — অথবা Excel/CSV ব্যবহার করুন', 'err');
    return;
  }
  const pdfLib = window.pdfjsLib || window['pdfjs-dist/build/pdf'] || window.pdfjs;
  if (!pdfLib) {
    toast('PDF লাইব্রেরি লোড হয়নি। ইন্টারনেট চালু করে রিফ্রেশ করুন। অথবা Excel/CSV দিন।', 'err');
    return;
  }
  toast('PDF পড়া হচ্ছে...', 'gold');
  try {
    try {
      pdfLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    } catch (e) {}
    const buf = await file.arrayBuffer();
    let pdf;
    try {
      pdf = await pdfLib.getDocument({ data: buf }).promise;
    } catch (werr) {
      // Worker fail on some mobiles — retry without worker
      pdf = await pdfLib.getDocument({ data: buf, disableWorker: true }).promise;
    }
    let text = '';
    for (let i = 1; i <= Math.min(pdf.numPages, 5); i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(it => it.str).join(' ') + '\n';
    }
    // Heuristic parse for transcript-like PDFs
    const get = (re) => {
      const m = text.match(re);
      return m ? m[1].trim() : '';
    };
    const studentName = get(/Student'?s?\s*Name\s*[:\|]?\s*([A-Za-z\u0980-\u09FF .]+)/i)
      || get(/নাম\s*[:\|]?\s*([A-Za-z\u0980-\u09FF .]+)/);
    const father = get(/Father'?s?\s*Name\s*[:\|]?\s*([A-Za-z\u0980-\u09FF .]+)/i)
      || get(/পিতা[^\n]{0,10}[:\|]?\s*([A-Za-z\u0980-\u09FF .]+)/);
    const cls = get(/Class\s*[:\|]?\s*([A-Za-z0-9\u0980-\u09FF ]+)/i)
      || get(/শ্রেণি\s*[:\|]?\s*([A-Za-z0-9\u0980-\u09FF ]+)/);
    const sid = get(/\bID\s*[:\|]?\s*(\d+)/i) || get(/আইডি\s*[:\|]?\s*(\d+)/);
    const roll = get(/Roll\s*(?:Number|No\.?)?\s*[:\|]?\s*(\d+)/i) || get(/রোল\s*[:\|]?\s*(\d+)/);
    const merit = get(/Merit\s*Position\s*[:\|]?\s*(\d+)/i) || get(/মেধা\s*[:\|]?\s*(\d+)/);
    const remarks = get(/Remarks?\s*[:\|]?\s*(.{10,120})/i) || '';

    // Subject lines: "1 Quran Majid 100 86 86.0"
    const subjects = [];
    const subjRe = /(\d+)\s+([A-Za-z\u0980-\u09FF][A-Za-z\u0980-\u09FF0-9 .,&\-]{2,40}?)\s+(\d{1,3})\s+(\d{1,3}(?:\.\d+)?)\s+(\d{1,3}(?:\.\d+)?)/g;
    let sm;
    while ((sm = subjRe.exec(text)) !== null) {
      const full = Number(sm[3]);
      const obt = Number(sm[4]);
      if (full > 0 && obt <= full + 5) {
        subjects.push({ name: sm[2].trim(), full, obtained: obt });
      }
    }

    if (!studentName && !subjects.length) {
      toast('PDF থেকে টেবিল পড়া যায়নি। অনুগ্রহ করে Excel/CSV তে রূপান্তর করে ইমপোর্ট করুন।', 'err');
      console.log('PDF text sample:', text.slice(0, 500));
      return;
    }

    DB.results = DB.results || [];
    DB.results.push({
      id: uid('r'),
      studentName: studentName || 'Unknown',
      fatherName: father || '',
      class: cls || (DB.classes[0] || ''),
      studentId: sid || roll || '',
      roll: roll || sid || '',
      year: (DB.academicYears && DB.academicYears[0]) || '২০২৬',
      examType: (DB.examTypes && DB.examTypes[0]) || 'অর্ধবার্ষিক',
      branch: 'বালক',
      meritPosition: merit || '',
      remarks: remarks,
      subjects: subjects.length ? subjects : [{ name: 'Imported from PDF', full: 100, obtained: 0 }],
      pdfAttachment: null
    });
    saveDB();
    renderAdmin();
    try { if (typeof cloudPush === 'function') cloudPush(); } catch(e){}
    toast('PDF থেকে ফলাফল ইমপোর্ট ✓ (' + subjects.length + ' বিষয়)', 'gold');
  } catch (err) {
    console.error(err);
    toast('PDF ইমপোর্ট ব্যর্থ: ' + (err.message || '') + ' — Excel/CSV ব্যবহার করুন', 'err');
  }
}

function handlePdfAttachment(inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
    toast('শুধু PDF ফাইল দিন', 'err');
    inputEl.value = '';
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    toast('PDF ৫MB এর কম হতে হবে', 'err');
    inputEl.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = ev => {
    // store as data URL so notice attachment works offline
    window._lastPdfDataUrl = ev.target.result;
    window._lastPdfName = file.name;
    const preview = document.getElementById('pdfAttachPreview');
    if (preview) preview.textContent = '✓ ' + file.name + ' নির্বাচিত';
    toast('PDF প্রস্তুত — নোটিশ সংরক্ষণ করলে সংযুক্ত হবে', 'gold');
  };
  reader.readAsDataURL(file);
  inputEl.value = '';
}

function addResult() {
  const name = document.getElementById('rName').value.trim();
  const sid  = (document.getElementById('rStudentId')||{}).value?.trim() || '';
  const roll = document.getElementById('rRoll').value.trim();
  const cls  = document.getElementById('rClass').value;
  if (!name || (!sid && !roll) || !cls) { toast('নাম, আইডি/রোল ও শ্রেণি দিন', 'err'); return; }
  const subjects = [];
  document.querySelectorAll('#subjRows .marks-editor').forEach(r => {
    const n = r.querySelector('[data-k="name"]').value.trim();
    const f = Number(r.querySelector('[data-k="full"]').value) || 0;
    const o = Number(r.querySelector('[data-k="obtained"]').value) || 0;
    if (n) subjects.push({name:n, full:f, obtained:o});
  });
  if (!subjects.length) { toast('অন্তত একটি বিষয় যোগ করুন', 'err'); return; }
  DB.results.push({
    id: uid('r'), studentName: name,
    fatherName: document.getElementById('rFather').value.trim(),
    class: cls,
    studentId: sid || roll,
    roll: roll || sid,
    year: document.getElementById('rYear').value,
    examType: document.getElementById('rExam').value,
    branch: (document.getElementById('rBranch')||{}).value || 'বালক',
    meritPosition: document.getElementById('rMerit').value.trim(),
    remarks: document.getElementById('rRemarks').value.trim(),
    subjects
  });
  saveDB(); renderAdmin(); toast('সংরক্ষিত ✓');
}
function delResult(id) {

              <td><input type="text" value="${esc(g.grade)}" onchange="DB.grading[${i}].grade=this.value;saveDB()" style="width:60px;padding:6px;border:2px solid var(--border);border-radius:8px"></td>
              <td><input type="number" step="0.1" value="${g.gpa}" onchange="DB.grading[${i}].gpa=+this.value;saveDB()" style="width:70px;padding:6px;border:2px solid var(--border);border-radius:8px"></td>
              <td><input type="color" value="${g.color}" onchange="DB.grading[${i}].color=this.value;saveDB()" style="width:48px;height:36px;padding:2px;border-radius:8px;border:2px solid var(--border)"></td>
              <td><button class="mini-btn mini-del" onclick="delGrade(${i})">✕</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    <button class="btn btn-primary" style="margin-top:16px" onclick="savePassMark()">💾 পাস মার্ক সংরক্ষণ</button>
  </div>`;
}
function addGrade() { DB.grading.push({min:0,max:0,grade:'-',gpa:0,color:'#999999'}); saveDB(); renderAdmin(); }
function delGrade(i) { DB.grading.splice(i,1); saveDB(); renderAdmin(); toast('মুছে ফেলা হয়েছে'); }
function savePassMark() {
  const v = Number(document.getElementById('passMark').value);
  if (isNaN(v) || v < 0) { toast('সঠিক পাস মার্ক দিন', 'err'); return; }
  DB.passMark = v; saveDB(); toast('সংরক্ষিত ✓');
}

function saveUiPrefs() {
  if (!DB.ui) DB.ui = {};
  DB.ui.lang = document.getElementById('uiLang').value;
  DB.ui.showCredit = document.getElementById('uiCredit').value === '1';
  // save without cloud loop issues
  try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); } catch(e){}
  toast('সংরক্ষিত ✓ — পেজ রিলোড হলে দেখাবে', 'gold');
}

async function startCloudSync() {
  try {
    toast('ক্লাউড সিঙ্ক তৈরি হচ্ছে...', 'gold');
    const id = await cloudCreate();
    renderAdmin();
    toast('মাল্টি-ডিভাইস চালু ✓ Sync ID কপি করে অন্য ফোনে দিন', 'gold');
    const el = document.getElementById('cloudIdBox');
    if (el) { el.select(); }
  } catch (e) {
    toast('সিঙ্ক চালু ব্যর্থ: ' + (e.message || 'নেটওয়ার্ক সমস্যা'), 'err');
  }
}

async function joinCloudSync() {
  const id = (document.getElementById('joinCloudId') || {}).value || '';
  try {
    toast('ক্লাউড থেকে লোড হচ্ছে...', 'gold');
    await cloudConnect(id.trim());
    renderAdmin();
    toast('সংযুক্ত ✓ অন্য ফোনের ডেটা এসেছে', 'gold');
  } catch (e) {
    toast('সংযোগ ব্যর্থ: ' + (e.message || ''), 'err');
  }
}

async function pullCloudNow() {
  try {
    toast('আপডেট টানা হচ্ছে...', 'gold');
    const ok = await cloudPull(false);
    if (ok) renderAdmin();
  } catch (e) {
    toast('টানা ব্যর্থ', 'err');
  }
}

function copyCloudId() {
  const id = (DB.ui && DB.ui.cloudId) || '';
  if (!id) { toast('আগে সিঙ্ক চালু করুন', 'err'); return; }
  navigator.clipboard.writeText(id).then(() => toast('Sync ID কপি হয়েছে ✓', 'gold'))
    .catch(() => {
      const t = document.getElementById('cloudIdBox');
      if (t) { t.select(); document.execCommand('copy'); toast('কপি হয়েছে', 'gold'); }
    });
}

function disableCloudSync() {
  if (!DB.ui) DB.ui = {};
  DB.ui.cloudEnabled = false;
  // keep cloudId so can re-enable
  try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); } catch(e){}
  renderAdmin();
  toast('অটো-সিঙ্ক বন্ধ (ID সংরক্ষিত)', 'gold');
}

function adminBackup() {
  const showCredit = !(DB.ui && DB.ui.showCredit === false);
  const lang = (DB.ui && DB.ui.lang) || 'bn';
  const cloudId = (DB.ui && DB.ui.cloudId) || '';
  const cloudOn = !!(DB.ui && DB.ui.cloudEnabled && cloudId);
  const lastSync = (DB.ui && DB.ui.lastCloudSync) ? new Date(DB.ui.lastCloudSync).toLocaleString('bn-BD') : '—';
  return `
  <h3>ব্যাকআপ ও রিস্টোর</h3>
  <p class="sub">মাল্টি-ডিভাইস সিঙ্ক · JSON ব্যাকআপ · ভাষা সেটিং</p>

  <div class="admin-card" style="border:2px solid var(--gold-400)">
    <h4>📱 মাল্টি-ডিভাইস সিঙ্ক (সব ফোনে একই ডেটা)</h4>
    <p style="font-size:.88rem;color:var(--muted);margin-bottom:12px;line-height:1.55">
      সমস্যা: এক ফোনে যোগ করলে অন্য ফোনে দেখা যেত না — কারণ ডেটা শুধু ওই ফোনের ব্রাউজারে থাকত।<br>
      <strong>সমাধান:</strong> নিচে সিঙ্ক চালু করুন → Sync ID অন্য ফোনে দিয়ে সংযুক্ত হন → দুই ফোনেই একই ডেটা দেখাবে।
    </p>
    ${cloudOn ? `
      <div class="alert alert-success" style="margin-bottom:12px">
        <span>✅</span>
        <div><strong>সিঙ্ক চালু আছে</strong><br>শেষ আপডেট: ${esc(lastSync)}</div>
      </div>
      <div class="field"><label>আপনার Sync ID (অন্য ফোনে দিন)</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <input id="cloudIdBox" value="${esc(cloudId)}" readonly style="flex:1;font-family:monospace;font-weight:700">
          <button class="btn btn-gold btn-sm" onclick="copyCloudId()">📋 কপি</button>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        <button class="btn btn-primary btn-sm" onclick="pullCloudNow()">⬇️ এখনই আপডেট নিন</button>
        <button class="btn btn-outline btn-sm" onclick="disableCloudSync()">⏸ অটো-সিঙ্ক বন্ধ</button>
      </div>
    ` : `
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
        <button class="btn btn-primary" onclick="startCloudSync()">🚀 নতুন সিঙ্ক চালু করুন (প্রথম ফোন)</button>
      </div>
      <div class="field"><label>অথবা অন্য ফোনের Sync ID দিয়ে যোগ দিন</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <input id="joinCloudId" placeholder="Sync ID পেস্ট করুন" style="flex:1;font-family:monospace">
          <button class="btn btn-gold" onclick="joinCloudSync()">🔗 সংযুক্ত হন</button>
        </div>
      </div>
      ${cloudId ? `<p style="font-size:.82rem;color:var(--muted);margin-top:8px">পুরনো ID: <code>${esc(cloudId)}</code> — আবার চালু করতে উপরের বক্সে পেস্ট করে সংযুক্ত হন</p>` : ''}
    `}
  </div>

  <div class="admin-card">
    <h4>🌐 ভাষা ও ক্রেডিট</h4>
    <div class="admin-form-grid">
      <div class="field" style="margin-bottom:0">
        <label>সাইটের ভাষা</label>
        <select id="uiLang">
          <option value="bn" ${lang==='bn'?'selected':''}>বাংলা</option>
          <option value="en" ${lang==='en'?'selected':''}>English</option>
        </select>
      </div>
      <div class="field" style="margin-bottom:0">
        <label>নিচে "Created By" দেখাবে?</label>
        <select id="uiCredit">
          <option value="1" ${showCredit?'selected':''}>হ্যাঁ — ছোট সিগনেচার</option>
          <option value="0" ${!showCredit?'selected':''}>না — লুকানো</option>
        </select>
      </div>
    </div>
    <button class="btn btn-primary btn-sm" style="margin-top:12px" onclick="saveUiPrefs()">💾 সংরক্ষণ</button>
  </div>
  <div class="admin-card">
    <h4>💾 ব্যাকআপ ডাউনলোড</h4>
    <p style="font-size:.9rem;color:var(--muted);margin-bottom:14px">সব তথ্য একটি ফাইলে সংরক্ষণ করুন — অন্য ডিভাইসে ব্যবহার করতে পারবেন।</p>
    <button class="btn btn-primary" onclick="downloadBackup()">⬇️ ডাউনলোড</button>
  </div>
  <div class="admin-card">
    <h4>📤 রিস্টোর</h4>
    <p style="font-size:.9rem;color:var(--muted);margin-bottom:14px">পূর্বে ডাউনলোড করা JSON ফাইল আপলোড করুন।</p>
    <input type="file" accept=".json" onchange="restoreBackup(event)" style="padding:12px;border:2px dashed var(--border);border-radius:12px;width:100%">
  </div>
  <div class="admin-card" style="border-color:rgba(192,57,43,.3)">
    <h4 style="color:#a52833">⚠️ ডেঞ্জার জোন</h4>
    <p style="font-size:.9rem;color:var(--muted);margin-bottom:14px">সব ডেটা মুছে ফেলে ওয়েবসাইট খালি অবস্থায় ফিরিয়ে নিন।</p>
    <button class="btn btn-danger" onclick="resetAll()">🗑️ সব ডেটা মুছুন</button>
  </div>`;
}
function downloadBackup() {
  const data = JSON.stringify(DB, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'madrasa-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('ডাউনলোড ✓');
}
function restoreBackup(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.config) throw new Error('invalid');
      if (!confirm('বর্তমান সব ডেটা প্রতিস্থাপিত হবে। নিশ্চিত?')) return;
      DB = data;
      saveDB(); renderAdmin(); toast('রিস্টোর ✓', 'gold');
    } catch (err) { toast('ভুল ফাইল', 'err'); }
  };
  reader.readAsText(file);
}
function resetAll() {
  if (!confirm('সব ডেটা মুছে ফেলতে চান?')) return;
  if (!confirm('আবার নিশ্চিত করুন — সব হারিয়ে যাবে।')) return;
  DB = JSON.parse(JSON.stringify(defaultDB));
  saveDB(); renderAdmin(); toast('রিসেট সম্পন্ন', 'err');
}

function openEdit(title, bodyHtml, onSave) {
  document.getElementById('editTitle').textContent = title;
  document.getElementById('editBody').innerHTML = bodyHtml;
  editSaveCallback = onSave;
  document.getElementById('editOverlay').classList.add('open');
  document.getElementById('editSaveBtn').onclick = () => {
    if (editSaveCallback) editSaveCallback();
  };
}
function closeEdit() {
  document.getElementById('editOverlay').classList.remove('open');
  editSaveCallback = null;
}
document.getElementById('editOverlay').addEventListener('click', e => {
  if (e.target.id === 'editOverlay') closeEdit();
});

// Init
if (isLoggedIn()) showAdmin();
else showLogin();
</script>
</body>
</html>
